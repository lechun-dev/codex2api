name: codex2api

services:
  codex2api:
    image: ${CODEX2API_IMAGE:-ghcr.io/james-6-23/codex2api:v2.8.2}
    container_name: codex2api
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CODEX_PORT:-8080}:${CODEX_PORT:-8080}"
    env_file: [.env]
    volumes:
      - image-assets:/data
      - ./logs:/app/logs
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:$${CODEX_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped
    networks: [codex2api-net]

  postgres:
    image: postgres:18-alpine
    container_name: codex2api-postgres
    environment:
      DATABASE_USER: ${DATABASE_USER:-codex2api}
      POSTGRES_USER: ${DATABASE_USER:-codex2api}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-codex2api}
      PGDATA: /var/lib/postgresql/data
      TZ: ${TZ:-Asia/Shanghai}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DATABASE_USER:-codex2api}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [codex2api-net]

  redis:
    image: redis:7-alpine
    container_name: codex2api-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [codex2api-net]

networks:
  codex2api-net: {driver: bridge}

volumes:
  pgdata: {name: codex2api_pgdata}
  redisdata: {name: codex2api_redisdata}
  image-assets: {name: codex2api_image-assets}
